name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a superseded push should stop burning minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Every variant resolves to the identity it should, and a build that is
      # not configured for the environment it claims **fails** rather than
      # falling back to a device-local identity.
      - run: npm run check:config
      # The declared taxonomy is entirely wired, and the coverage table that is
      # offered as evidence still matches the source.
      - run: npm run check:events
      # The end-to-end flows *could fail*: every id they address exists, every
      # flow asserts something, and optional taps stay where they belong. A
      # device run cannot answer this — the old suite passed on a device while
      # addressing a testID the app did not have.
      - run: npm run check:e2e

  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `--detectOpenHandles` is not diagnostics here: a leaked timer is a leak
      # on a device too, and the config refresh leaked one per foreground.
      - run: npm test -- --ci --coverage --detectOpenHandles

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          retention-days: 7
          if-no-files-found: ignore
          path: coverage/**

  backend:
    name: Rules, pipeline and local store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The emulator suite needs a JDK; rules are tested against denial, which
      # is the failure mode that matters.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:emulator

  build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Catches anything that typechecks but cannot be bundled — a Metro
      # resolution failure never shows up in `tsc`. Built as development
      # because this job is about bundling, not configuration; `check:config`
      # is what asserts staging and production refuse an incomplete one.
      - run: npm run export:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 7

  android:
    name: Android native build
    runs-on: ubuntu-latest
    # Job-level, not step-level: Gradle's `:expo-constants:createExpoConfig`
    # re-evaluates `app.config.ts` in its own node process, so every step that
    # touches the config needs the variant. Without it the build defaults to
    # production and the environment guard refuses it — correctly.
    env:
      APP_VARIANT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      # A config-plugin or native-dependency change typechecks fine and then
      # fails on a device. Prebuild + assembleDebug is the cheapest gate that
      # catches it without EAS credentials.
      - run: npx expo prebuild --platform android --no-install --clean
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      # What the build actually contains: adaptive and monochrome icons, a
      # light and a dark splash, RTL, POST_NOTIFICATIONS, and auto-backup off
      # so private reflections do not reach cloud backup.
      - run: node scripts/check-android-native.mjs android

      # A Gradle failure is a wall of output that GitHub truncates. The reports
      # say which task failed and why; the manifest says what was generated.
      # Nothing here is a secret — no keystore, no google-services.json, no APK.
      - name: Upload native build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            android/build/reports/**
            android/app/build/reports/**
            android/app/build/outputs/logs/**
            android/app/src/main/AndroidManifest.xml

  doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    # No longer advisory. Doctor passes 21/21, and a dependency drifting away
    # from what the SDK expects is exactly the class of problem that shows up
    # first on a device, long after CI went green.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
