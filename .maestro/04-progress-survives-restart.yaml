# Progress survives a force-stop.
#
# The completion was written through on the block change, not on a save button,
# so killing the process must not cost it.
appId: com.dananeh.app.staging
---
- launchApp
- stopApp
- launchApp
- tapOn:
    id: "tab-garden"
- tapOn:
    id: "garden-segment-completed"

# The seed itself, by name. This used to assert «رسیده» — the label on the
# segment button, which is on screen whether or not anything survived.
- assertVisible: "چرا آسمان شب کاملاً تاریک است؟"
- takeScreenshot: garden-after-restart
